version: 2

models:
  - name: mart_base
    description: "Bang tong hop grain min nhat cua Southwest Airlines (WN) giai doan 2015-2018"
    columns:
      - name: year_month
        description: "Thang nam dinh dang YYYY-MM"
        tests:
          - not_null
      - name: day_of_week
        description: "Thu trong tuan tu 1 den 7"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5, 6, 7]
      - name: time_block
        description: "Khung gio ke hoach xuat phat"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Early Morning', 'Morning', 'Afternoon', 'Evening']
      - name: origin
        description: "Ma san bay xuat phat"
        tests:
          - not_null
      - name: destination
        description: "Ma san bay dich den"
        tests:
          - not_null
      - name: distance_group
        description: "Nhom cu ly tu G01 den G11"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['G01', 'G02', 'G03', 'G04', 'G05', 'G06', 'G07', 'G08', 'G09', 'G10', 'G11']
      - name: season
        description: "Mua trong nam"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Winter', 'Spring', 'Summer', 'Autumn']
      - name: eligible_flights
        description: "So chuyen bay du dieu kien"
        tests:
          - not_null
      - name: delayed_flights
        description: "So chuyen bay den tre tu 15 phut"
        tests:
          - not_null
      - name: sample_size
        description: "So chuyen du dieu kien dung sau ket qua cua segment (bang eligible_flights)"
        tests:
          - not_null
      - name: sample_size_flag
        description: "Trang thai du mau: Sufficient hoac Low Sample theo nguong tam thoi"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Sufficient', 'Low Sample']
      - name: baseline_delay_rate
        description: "Ty le tre tham chieu cua WN trong cung season + time_block"
      - name: baseline_gap
        description: "Chenh lech diem % giua delay_rate cua segment va baseline_delay_rate"
      - name: average_arrival_delay
        description: "Phut tre den trung binh tren tap chuyen du dieu kien (= arrival_delay_sum / eligible_flights)"

  - name: fact_flight
    description: "Fact o grain chuyen bay, noi voi dimension bang surrogate key (-1 = Unknown Member)"
    columns:
      - name: flight_key
        description: "Khoa ky thuat duy nhat cua FactFlight"
        tests:
          - not_null
          - unique
      - name: carrier_key
        tests:
          - not_null
      - name: origin_airport_key
        tests:
          - not_null
      - name: destination_airport_key
        tests:
          - not_null
      - name: route_key
        tests:
          - not_null
      - name: distance_group_key
        tests:
          - not_null
      - name: business_key_duplicate_flag
        description: "True neu to hop 6 truong business key (date+carrier+flight_number+origin+dest+crs_dep_time) xuat hien nhieu hon 1 lan"
        tests:
          - not_null
      - name: delay_outcome
        description: "1 = tre, 0 = khong tre, NULL = khong xac dinh duoc ket qua den (thieu ARR_DELAY). Khac is_delayed (luon 0/1, dung de SUM KPI)."
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]
              config:
                where: "delay_outcome IS NOT NULL"

  - name: mart_carrier_benchmark
    description: "So sanh WN voi hang tham chieu (DL, AA) tren cung route + time_block + thang"
    columns:
      - name: carrier
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['WN', 'DL', 'AA']
      - name: sample_size_flag
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Sufficient', 'Low Sample']
      - name: average_arrival_delay
        description: "Phut tre den trung binh tren tap chuyen du dieu kien cua tung hang"
      - name: baseline_delay_rate
        description: "Ty le tre gop cua hang tham chieu (khac WN) cung route+time_block+thang. NULL o dong khong phai WN."
      - name: baseline_gap
        description: "delay_rate (dong WN) - baseline_delay_rate. NULL o dong khong phai WN."

  - name: mart_model_features
    description: "Feature mart cho DSS: dac trung pre-flight-safe + nhan delay_outcome, chia theo dataset_split (train/validation/test theo nam)"
    columns:
      - name: flight_key
        tests:
          - not_null
          - unique
      - name: dataset_split
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['train', 'validation', 'test']
      - name: delay_outcome
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]

  - name: dq_log
    description: "Bang doi soat chat luong du lieu: so dong, undetermined outcome, trung khoa, khoa chua map duoc"

  - name: mart_delay_causes
    description: "Bang tong hop 5 nguyen nhan tre cua Southwest Airlines (WN) 2015-2018"
    columns:
      - name: year_month
        tests:
          - not_null
      - name: origin
        tests:
          - not_null
      - name: destination
        tests:
          - not_null
      - name: cause
        description: "Loai nguyen nhan tre"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Carrier', 'Weather', 'NAS', 'Security', 'LateAircraft']
      - name: affected_flights
        tests:
          - not_null
      - name: delay_minutes
        tests:
          - not_null

  - name: dim_date
    description: "Bang chieu thoi gian 1.461 ngay tu 2015 den 2018"
    columns:
      - name: flight_date
        tests:
          - not_null
          - unique

  - name: dim_carrier
    description: "Bang chieu 19 hang hang khong noi dia My"
    columns:
      - name: carrier_code
        tests:
          - not_null
          - unique
      - name: carrier_name
        tests:
          - not_null

  - name: dim_scheduled_time
    description: "Bang chieu thoi gian khoi hanh du kien (DimScheduledTime)"
    columns:
      - name: scheduled_time_key
        tests:
          - not_null
          - unique
      - name: crs_dep_time
        description: "NULL cho dong Unknown Member (scheduled_time_key = -1)"
        tests:
          - unique
          - not_null:
              config:
                where: "scheduled_time_key != -1"
      - name: time_block
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Early Morning', 'Morning', 'Afternoon', 'Evening', 'Unknown']

  - name: dim_airport
    description: "Bang chieu san bay noi dia My"
    columns:
      - name: airport_key
        tests:
          - not_null
          - unique
      - name: airport_code
        tests:
          - not_null
          - unique

  - name: dim_route
    description: "Bang chieu tuyen bay co huong"
    columns:
      - name: route_key
        tests:
          - not_null
          - unique
      - name: origin
        tests:
          - not_null
      - name: destination
        tests:
          - not_null

  - name: dim_distance_group
    description: "Bang chieu 11 nhom cu ly tieu chuan BTS"
    columns:
      - name: distance_group_key
        tests:
          - not_null
          - unique
      - name: distance_group
        tests:
          - not_null
          - unique
